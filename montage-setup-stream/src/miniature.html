<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Miniature setup stream</title>
<style>
@font-face { font-family: "Lilita One"; src: url(../../pub-vnr/assets/fonts/lilita-one-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC; }
@font-face { font-family: "Lilita One"; src: url(../../pub-vnr/assets/fonts/lilita-one-latin-ext.woff2) format("woff2"); unicode-range: U+0100-02BA, U+1E00-1E9F; }
@font-face { font-family: "Nunito"; font-weight: 500 900; src: url(../../pub-vnr/assets/fonts/nunito-latin.woff2) format("woff2"); }
* { box-sizing: border-box; }
html, body { margin: 0; }
/* Sobre : noir, blanc, la photo. Texte dans la zone 3:4 visible sur la grille du profil (y 240 → 1680). */
#c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #111; font-family: "Nunito", sans-serif; color: #fff; }
#bgphoto { position: absolute; inset: -80px; background: url(../build/thumb/photo.png) center / cover; filter: blur(50px) brightness(.3) grayscale(.6); }
#photo { position: absolute; left: 60px; top: 640px; width: 960px; height: 920px; border-radius: 36px; overflow: hidden; box-shadow: 0 30px 80px #000c; }
#photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
#title { position: absolute; left: 60px; right: 60px; top: 300px; text-align: center; font-family: "Lilita One"; line-height: .95; }
#title .a { display: block; font-size: 156px; white-space: nowrap; }
#title .b { display: block; font-size: 80px; margin-top: 18px; color: #d8d8d8; }
#tag { position: absolute; left: 0; right: 0; top: 1600px; text-align: center; }
#tag span { display: inline-block; font-weight: 900; font-size: 44px; color: #111; background: #fff; border-radius: 999px; padding: 14px 36px; }
</style>
</head>
<body>
<div id="c">
  <div id="bgphoto"></div>
  <div id="title"><span class="a">QUEL SETUP&nbsp;?</span><span class="b">pour débuter le stream</span></div>
  <div id="photo"><img src="../build/thumb/photo.png" alt=""></div>
  <div id="tag"><span>budget limité · dis-le en comm'</span></div>
</div>
</body>
</html>
