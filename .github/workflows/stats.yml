name: Update live stats

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh stats.json
        run: node scripts/update-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          if git diff --quiet stats.json && git diff --quiet releases.json 2>/dev/null && git ls-files --error-unmatch releases.json >/dev/null 2>&1; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898291+github-actions[bot]@users.noreply.github.com"
          git add stats.json releases.json
          git commit -m "chore: update live stats"
          for attempt in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((attempt * 5))
          done
          exit 1
